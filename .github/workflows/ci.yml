name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint with flake8
        run: flake8 src tests --max-line-length=120 --extend-ignore=E203,W503

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests
        run: |
          solvato-dyne --help
          solvato-dyne simulate --system water-dimer --integrator drude --steps 120
          solvato-dyne remd --system ala-dipeptide --replicas 4 --cycles 12 --steps-per-cycle 15
          solvato-dyne metad --system ala-dipeptide --steps 150 --stride 15
          solvato-dyne steer --system host-guest --n-paths 4 --steps 80
          solvato-dyne modes --system helix8 --method anm
          solvato-dyne calibrate --quick

      - name: Run standalone examples
        run: |
          python examples/01_drude_polarizable_water_and_dipole.py
          python examples/02_gbsa_alanine_dipeptide_metadynamics.py
          python examples/03_tre_md_peptide_folding_and_nma.py
          python examples/04_bidirectional_smd_crooks_unbinding.py
